  - szoveg: SQL sysadmin / service account külön jegy a SQL DBA-nak (Farkas Éva); az AD fiók létrehozása nem tartalmaz SQL jogosultságot.
    kulcsszavak: [sql, sysadmin, service account, sqlsa]

  - szoveg: Windows failover cluster / backup agent / monitoring agent riasztás → Kovács Anna (Windows cluster) vagy Katona Márta (OS/storage).
    kulcsszavak: [windows, cluster, quorum, backup agent, monitoring agent]

  - szoveg: Kilépéses fióktörlésnél a HR kategóriát ellenőrizni kell; a törlés AD Admin feladat.
    kulcsszavak: [kilepes, fioktorles, hr, adatgazdai]

  - szoveg: A helyettes csak akkor kapja a jegyet, ha az elsődleges megoldó nem elérhető; a helyettes-lánc nem jelent automatikus megosztást.
    kulcsszavak: []
